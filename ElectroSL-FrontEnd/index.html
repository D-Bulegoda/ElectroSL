<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Character Encoding & Cross-Browser Compatibility -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive Viewport for All Mobile, Tablet, Laptop & Ultra-Wide Devices -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />

    <!-- Primary SEO & App Identity -->
    <title>ElectroSL | Certified Electricians &amp; 2D Circuit Quality Network</title>
    <meta
      name="description"
      content="Connect with NVQ-certified and 2D simulator-verified electricians across Sri Lanka. Live GPS tracking, 24/7 emergency SOS, and transparent quotes."
    />
    <meta
      name="keywords"
      content="ElectroSL, electrician Sri Lanka, certified electrician, electrical repair, emergency electrician, 2D circuit simulator, NVQ electrician"
    />
    <meta name="author" content="ElectroSL Team" />
    <meta name="robots" content="index, follow" />

    <!-- Mobile Browser & PWA Theme Styling (Matches ElectroSL Navy Blue) -->
    <meta name="theme-color" content="#0F294A" />
    <meta name="msapplication-TileColor" content="#0F294A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ElectroSL" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Social Sharing Preview (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElectroSL" />
    <meta property="og:title" content="ElectroSL | Certified Electricians at Your Doorstep" />
    <meta
      property="og:description"
      content="Fast, safe, and verified electrical services with live GPS technician tracking and transparent pricing."
    />
    <meta property="og:locale" content="en_LK" />

    <!-- Twitter / X Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ElectroSL | Certified Electricians at Your Doorstep" />
    <meta
      name="twitter:description"
      content="Fast, safe, and verified electrical services with live GPS technician tracking and transparent pricing."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
